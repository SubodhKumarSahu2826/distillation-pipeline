[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distill"
version = "0.0.0"
description = "Fine-tuning model distillation pipeline: distill structured extraction from a teacher LLM into a self-hosted student."
readme = "README.md"
requires-python = ">=3.10"
# Phase 1 introduces the Pydantic extraction contract (src/distill/schema.py), which is
# imported across the pipeline — so pydantic is now a real runtime dependency (updates
# Phase-0 D-004's "zero runtime deps"). Heavier, phase-specific deps stay in extras below.
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
# Phase 1–2: talk to the teacher API.
teacher = ["anthropic>=0.40"]
# Phase 3: LoRA/QLoRA fine-tuning of the student.
train = [
  "torch",
  "transformers",
  "peft",
  "trl",
  "accelerate",
  "bitsandbytes",
  "datasets>=2",
  "wandb",
]
# Phase 5: serve the student and route/escalate to the teacher.
serve = ["vllm", "fastapi", "uvicorn"]
# Local development tooling (already available on most machines).
dev = ["ruff>=0.6", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, import sorting

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
